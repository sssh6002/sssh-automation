# 陳核路徑判斷 — 命中「他人業務」者不自動送陳核，改由承辦人自行在 edoc 處理。
#
# 為什麼需要這份清單:
#   有些公文雖然分到你手上，但業務性質不屬於你原本的組室（原圖資老師離職後，
#   她的業務移交過來）。edoc 只在「代理」時於簽核鏈標「(代理：職稱 姓名)」，
#   而且那是**簽完之後**才出現；業務移交後更是完全沒有標記。機器看不出來。
#
# 主要訊號:來文的**發文字別**（發文字號「○○字第…號」的○○）。
#   這是公文自己帶的資料，比關鍵字準得多。

# 這些字別的公文屬於「我的業務」→ 照常自動陳核
本人字別:
  - 北市教資  # 臺北市政府教育局 資訊教育科
  - 臺教資   # 教育部 資訊及科技教育司
  - 北市教職  # 臺北市政府教育局 職業教育科（設備、無人機等）

# 這些字別屬於「他人業務」→ 擋下，陳核路徑不同
他人字別:
  - 北市教中  # 臺北市政府教育局 中等教育科 — 原圖資老師業務
  - 北市圖   # 臺北市立圖書館（北市圖諮等）
  - 圖推    # 圖書推廣

# 上面兩份清單都沒命中時的處理:'pass' 照常送 / 'block' 一律擋下先問人
未知字別: pass

# 他人業務的主題關鍵字。**優先於字別** —— 業務是按主題分的，不是按來文機關分的。
# 實例:MWAA1156007510「數位學生證結合圖書館借閱證」發文字別是「北市教資」
#       （本人字別），但學生證業務屬圖資老師，字別在這裡會判錯。
#
# 只放明確屬於他人業務的詞。太泛的詞會誤擋 —— 曾經放過又拿掉的:
#   「閱讀推廣」高餐大桌遊公文摘要寫「可作為閱讀推廣教材」就中（2026-07-29 實測）
#   「圖書館」  來文機關自己是圖書館時必中（例:高餐大圖書館）
關鍵字:
  - 借閱證
  - 學生證
  - 閱讀心得
  - 小論文
  - 國資圖
  - 行動書車
  - 圖書館閱讀推動教師
  - 書展
  - 行動展
  - 文學館

# 命中時顯示的說明（可自行改寫）
說明: 這類公文的陳核路徑與一般公文不同，請自行在 edoc 送陳核。
